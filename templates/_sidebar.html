<div class="barra-lateral">
  <h4>{{ etapa_titulo|default('Etapa 1') }}</h4>
  <ul>
    {% for slug, etiqueta in (submenu_actual|default(submenu)) %}
    <li{% if activo == slug %} class="activo"{% endif %}>
      <a href="{{ url_for(slug) }}">{{ etiqueta }}</a>
    </li>
    {% endfor %}
  </ul>
</div>
